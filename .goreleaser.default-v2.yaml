version: 2

nightly:
  # RFC-0013: CI passes a SemVer development version (formancehq/ci/actions/dev-version)
  # as DEV_VERSION, e.g. 2.7.2-dev.3.ga1c2c45. Without it, nightly builds keep the SHA,
  # and every tag below renders exactly as before.
  version_template: >-
    {{ if index .Env "DEV_VERSION" }}{{ .Env.DEV_VERSION }}{{ else }}{{ .FullCommit }}{{ end }}
  publish_release: false

checksum:
  name_template: '{{.ProjectName}}_checksums.txt'

snapshot:
  version_template: "{{ .Version }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^spec:'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: 'New Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 10
    - title: Other work
      order: 999

# Docker v2 requires platform-aware COPY paths in both consumer Dockerfiles.
dockers_v2:
  - id: standard
    dockerfile: build.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if or (not .IsNightly) (index .Env "DEV_VERSION") }}v{{ end }}{{ .Version }}'
      - '{{ if not .IsNightly }}{{if not .Prerelease }}latest{{ end }}{{ end }}'
      # RFC-0013: keep the full-SHA tag as a compatibility alias of SemVer nightlies.
      - '{{ if and .IsNightly (index .Env "DEV_VERSION") }}{{ .FullCommit }}{{ end }}'
    platforms: [linux/amd64, linux/arm64/v8]
    flags: [--provenance=false]
    sbom: false
    labels: &image_labels
      org.opencontainers.image.title: '{{ .ProjectName }}'
      org.opencontainers.image.description: '{{ .ProjectName }}'
      org.opencontainers.image.url: 'https://github.com/formancehq/{{ .ProjectName }}'
      org.opencontainers.image.source: 'https://github.com/formancehq/{{ .ProjectName }}'
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.created: '{{ time "2006-01-02T15:04:05Z07:00" }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.licenses: 'MIT'
  - id: scratch
    dockerfile: scratch.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if or (not .IsNightly) (index .Env "DEV_VERSION") }}v{{ end }}{{ .Version }}-scratch'
      - '{{ if and .IsNightly (index .Env "DEV_VERSION") }}{{ .FullCommit }}-scratch{{ end }}'
    platforms: [linux/amd64, linux/arm64/v8]
    flags: [--provenance=false]
    sbom: false
    labels: *image_labels
  - id: amd64
    dockerfile: build.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if or (not .IsNightly) (index .Env "DEV_VERSION") }}v{{ end }}{{ .Version }}-amd64'
    platforms: [linux/amd64]
    flags: [--provenance=false]
    sbom: false
    labels: *image_labels
  - id: amd64-scratch
    dockerfile: scratch.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if or (not .IsNightly) (index .Env "DEV_VERSION") }}v{{ end }}{{ .Version }}-amd64-scratch'
    platforms: [linux/amd64]
    flags: [--provenance=false]
    sbom: false
    labels: *image_labels
  - id: arm64
    dockerfile: build.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if or (not .IsNightly) (index .Env "DEV_VERSION") }}v{{ end }}{{ .Version }}-arm64'
    platforms: [linux/arm64/v8]
    flags: [--provenance=false]
    sbom: false
    labels: *image_labels
  - id: arm64-scratch
    dockerfile: scratch.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if or (not .IsNightly) (index .Env "DEV_VERSION") }}v{{ end }}{{ .Version }}-arm64-scratch'
    platforms: [linux/arm64/v8]
    flags: [--provenance=false]
    sbom: false
    labels: *image_labels
