version: 2

nightly:
  version_template: '{{ .FullCommit }}'
  publish_release: false

checksum:
  name_template: '{{.ProjectName}}_checksums.txt'

snapshot:
  version_template: "{{ .Version }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^spec:'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: 'New Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 10
    - title: Other work
      order: 999

# Docker v2 requires platform-aware COPY paths in both consumer Dockerfiles.
dockers_v2:
  - id: standard
    dockerfile: build.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}'
      - '{{ if not .IsNightly }}{{if not .Prerelease }}latest{{ end }}{{ end }}'
    platforms: [linux/amd64, linux/arm64/v8]
    flags: [--provenance=false]
    sbom: false
    labels: &image_labels
      org.opencontainers.image.title: '{{ .ProjectName }}'
      org.opencontainers.image.description: '{{ .ProjectName }}'
      org.opencontainers.image.url: 'https://github.com/formancehq/{{ .ProjectName }}'
      org.opencontainers.image.source: 'https://github.com/formancehq/{{ .ProjectName }}'
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.created: '{{ time "2006-01-02T15:04:05Z07:00" }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.licenses: 'MIT'
  - id: scratch
    dockerfile: scratch.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}-scratch'
    platforms: [linux/amd64, linux/arm64/v8]
    flags: [--provenance=false]
    sbom: false
    labels: *image_labels
  - id: amd64
    dockerfile: build.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}-amd64'
    platforms: [linux/amd64]
    flags: [--provenance=false]
    sbom: false
    labels: *image_labels
  - id: amd64-scratch
    dockerfile: scratch.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}-amd64-scratch'
    platforms: [linux/amd64]
    flags: [--provenance=false]
    sbom: false
    labels: *image_labels
  - id: arm64
    dockerfile: build.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}-arm64'
    platforms: [linux/arm64/v8]
    flags: [--provenance=false]
    sbom: false
    labels: *image_labels
  - id: arm64-scratch
    dockerfile: scratch.Dockerfile
    images: ["ghcr.io/formancehq/{{ .ProjectName }}"]
    tags:
      - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}-arm64-scratch'
    platforms: [linux/arm64/v8]
    flags: [--provenance=false]
    sbom: false
    labels: *image_labels
